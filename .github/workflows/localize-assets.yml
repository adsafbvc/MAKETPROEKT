name: Localize grant assets

on:
  push:
    paths:
      - '.github/workflows/localize-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  localize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy grant logos locally
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          curl -fL --retry 3 'https://raw.githubusercontent.com/adsafbvc/TEPKUM/main/assets/fsi-logo.svg' -o assets/fsi-logo.svg
          curl -fL --retry 3 'https://raw.githubusercontent.com/adsafbvc/TEPKUM/main/assets/platform-logo.png' -o assets/platform-logo.png
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('https://raw.githubusercontent.com/adsafbvc/TEPKUM/main/assets/fsi-logo.svg','assets/fsi-logo.svg')
          s = s.replace('https://raw.githubusercontent.com/adsafbvc/TEPKUM/main/assets/platform-logo.png','assets/platform-logo.png')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit local assets
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Store grant logos locally'
          git push
